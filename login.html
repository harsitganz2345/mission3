<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk ke Akun - VideoBelajar</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/navbar.css">
</head>
<body class="auth-page">
  <header class="navbar">
    <nav class="navbar-container">
      <a href="index.html" class="navbar-logo">
        videobelajar
      </a>
    </nav>
  </header>
  <main class="auth-card">
    <header class="auth-header">
      <h1>Masuk ke Akun</h1>
      <p>Yuk, lanjutin belajar mu di videobelajar.</p>
    </header>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">E-Mail <span>*</span></label>
        <input id="email" type="email" required>
        <small class="error" id="emailError"></small>
      </div>

      <div class="field password-field">
        <label for="password">Kata Sandi <span>*</span></label>
        <div class="password-wrap">
          <input id="password" type="password" required>
          <button
            type="button"
            class="eye-btn"
            data-toggle="password"
            aria-label="Tampilkan kata sandi"
            aria-pressed="false"
          >
            <!-- Ikon mata terbuka -->
            <svg class="eye-icon eye-open is-hidden"
                xmlns="http://www.w3.org/2000/svg"
                width="22" height="22" viewBox="0 0 24 24"
                fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>

            <!-- Ikon mata dicoret -->
            <svg class="eye-icon eye-closed"
                xmlns="http://www.w3.org/2000/svg"
                width="22" height="22" viewBox="0 0 24 24"
                fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="m3 3 18 18"/>
              <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
              <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15 15 0 0 1-3 3.8"/>
              <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.4 0 2.7-.3 3.8-.8"/>
            </svg>
          </button>
        </div>
        <small class="error" id="passwordError"></small>
      </div>

      <a href="forgot-password.html" class="forgot-link">Lupa Password?</a>

      <button class="auth-btn primary" type="submit">Masuk</button>
      <a class="auth-btn secondary" href="register.html">Daftar</a>

      <div class="divider"><span></span><b>atau</b><span></span></div>

      <button type="button" class="google-btn" data-google>
        <svg
          class="google-logo"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 48 48"
          aria-hidden="true"
        >
          <path
            fill="#4285F4"
            d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z"
          />
          <path
            fill="#34A853"
            d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z"
          />
          <path
            fill="#FBBC05"
            d="M12.6 27.6a12 12 0 0 1 0-7.2v-5.3H5.8a20 20 0 0 0 0 17.8l6.8-5.3Z"
          />
          <path
            fill="#EA4335"
            d="M24 12.1c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6.1 29.5 4 24 4A20 20 0 0 0 5.8 15.1l6.8 5.3c1.6-4.8 6.1-8.3 11.4-8.3Z"
          />
        </svg> Masuk dengan Google
      </button>
    </form>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
