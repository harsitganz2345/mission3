<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password - VideoBelajar</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/navbar.css">
</head>
<body class="auth-page">
  <header class="navbar">
    <nav class="navbar-container">
      <a href="index.html" class="navbar-logo">
        videobelajar
      </a>
    </nav>
  </header>
  <main class="auth-card forgot-card">
    <header class="auth-header">
      <h1>Lupa Password?</h1>
      <p>Masukkan E-Mail kamu untuk melanjutkan.</p>
    </header>

    <form id="forgotForm" novalidate>
      <div class="field">
        <label for="email">E-Mail <span>*</span></label>
        <input id="email" type="email" required>
        <small class="error" id="emailError"></small>
      </div>

      <button class="auth-btn primary" type="submit">Kirim</button>
      <a class="auth-btn secondary" href="login.html">Kembali ke Masuk</a>
    </form>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
