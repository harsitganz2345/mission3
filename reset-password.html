<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atur Password Baru - VideoBelajar</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/navbar.css">
</head>
<body class="auth-page">
  <header class="navbar">
    <nav class="navbar-container">
      <a href="index.html" class="navbar-logo">
        videobelajar
      </a>
    </nav>
  </header>
  <main class="auth-card">
    <header class="auth-header">
      <h1>Atur Password Baru</h1>
      <p>Buat kata sandi baru untuk akunmu.</p>
    </header>

    <form id="resetForm" novalidate>
      <div class="field">
        <label for="password">Kata Sandi Baru <span>*</span></label>
        <div class="password-wrap">
          <input id="password" type="password" required>
          <button type="button" class="eye-btn" data-toggle="password" aria-label="Tampilkan kata sandi"></button>
        </div>
        <small class="error" id="passwordError"></small>
      </div>

      <div class="field">
        <label for="confirmPassword">Konfirmasi Kata Sandi <span>*</span></label>
        <div class="password-wrap">
          <input id="confirmPassword" type="password" required>
          <button type="button" class="eye-btn" data-toggle="confirmPassword" aria-label="Tampilkan konfirmasi kata sandi"></button>
        </div>
        <small class="error" id="confirmError"></small>
      </div>

      <button class="auth-btn primary" type="submit">Simpan Password</button>
      <a class="auth-btn secondary" href="login.html">Kembali ke Masuk</a>
    </form>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
